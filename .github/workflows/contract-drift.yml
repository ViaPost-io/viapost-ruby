name: Contract drift

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENAPI_SOURCE_URL: https://docs.viapost.io/openapi/public.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          ruby-version: "3.1"
      - run: ruby scripts/check_contract.rb --remote
