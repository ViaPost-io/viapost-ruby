name: Release Ruby gem

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag; must equal v + gem version
        required: true
        type: string
      publish_rubygems:
        description: Also publish this verified artifact to RubyGems
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Require exact release tag commit on main
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          EVENT_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ -n "$EVENT_SHA" ]; then
            test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Verify release tag matches gem version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: ruby scripts/check_release_tag.rb "$RELEASE_TAG"
      - run: ruby scripts/check_contract.rb
      - run: bundle exec rake test
      - run: bundle exec rubocop
      - run: bundle exec bundler-audit check --update
      - name: Build gem and checksum
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          mkdir -p dist
          release_version="${RELEASE_TAG#v}"
          source_sha="$(git rev-parse HEAD)"
          git rev-parse HEAD > dist/SOURCE_SHA
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            VIAPOST_SOURCE_SHA="$source_sha" \
            gem build viapost.gemspec --output "dist/viapost-${release_version}.gem"
          (cd dist && sha256sum -- ./*.gem SOURCE_SHA > SHA256SUMS)
          chmod a-w -- dist/*
      - name: Test gem in an isolated consumer
        run: |
          consumer="$(mktemp -d)"
          GEM_HOME="$consumer/gems" GEM_PATH="$consumer/gems" gem install --local --ignore-dependencies dist/*.gem
          GEM_HOME="$consumer/gems" GEM_PATH="$consumer/gems" ruby -rviapost -e 'abort unless ViaPost::VERSION == "0.2.0"'
          cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruby-gem
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  attest-build-provenance:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ruby-gem
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  publish-github-release:
    needs: [verify-and-build, attest-build-provenance]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ruby-gem
          path: dist
      - name: Publish verified gem and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          SOURCE_SHA="$(cat dist/SOURCE_SHA)"
          case "$SOURCE_SHA" in (*[!0-9a-f]*|'') exit 1;; esac
          test "${#SOURCE_SHA}" = 40
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_SHA"
          (cd dist && sha256sum -c SHA256SUMS)
          for artifact in dist/*.gem; do
            gh attestation verify "$artifact" \
              --repo "$GH_REPO" \
              --source-digest "$SOURCE_SHA" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml"
          done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            published="$(mktemp -d)"
            gh release download "$RELEASE_TAG" --dir "$published"
            diff -q "$published/SHA256SUMS" dist/SHA256SUMS
            (cd "$published" && sha256sum -c SHA256SUMS)
            (cd dist && sha256sum -c SHA256SUMS)
            test "$(find "$published" -maxdepth 1 -type f -printf '%f\n' | sort)" = \
              "$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
            for artifact in dist/*; do
              cmp --silent "$artifact" "$published/$(basename "$artifact")"
            done
            if [ "$release_is_draft" = true ]; then
              gh release edit "$RELEASE_TAG" --draft=false
            fi
          else
            gh release create "$RELEASE_TAG" dist/* --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
            gh release edit "$RELEASE_TAG" --draft=false
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false

  publish-to-rubygems:
    needs: publish-github-release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_rubygems == true
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ruby-gem
          path: dist
      - name: Publish manually approved artifact
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          SOURCE_SHA="$(cat dist/SOURCE_SHA)"
          case "$SOURCE_SHA" in (*[!0-9a-f]*|'') exit 1;; esac
          test "${#SOURCE_SHA}" = 40
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_SHA"
          (cd dist && sha256sum -c SHA256SUMS)
          for artifact in dist/*.gem; do
            gh attestation verify "$artifact" \
              --repo "$GH_REPO" \
              --source-digest "$SOURCE_SHA" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml"
          done
          gem push dist/*.gem
