name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.1", "3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - run: bundle exec rake test
      - run: bundle exec rubocop
      - run: ruby scripts/check_contract.rb
      - run: bundle exec bundler-audit check --update
      - run: gem build viapost.gemspec
      - run: gem install --local --ignore-dependencies viapost-*.gem
      - run: ruby -rviapost -e 'abort unless ViaPost::VERSION == "0.2.0"'
