name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.1", "3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - run: bundle exec rake test
      - run: bundle exec rubocop
      - run: ruby scripts/check_contract.rb
      - run: bundle exec bundler-audit check --update
      - run: gem build viapost.gemspec
      - run: gem install --local --ignore-dependencies viapost-*.gem
      - run: ruby -rviapost -e 'abort unless ViaPost::VERSION == "0.2.0"'
